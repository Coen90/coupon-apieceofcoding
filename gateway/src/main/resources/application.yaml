server:
  port: 8080

spring:
  application:
    name: coupon-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 대기실 진입을 클라이언트 IP별로 제한. 한도 넘으면 429 (어뷰저 컷).
            - id: waiting-room-enter
              uri: ${COUPON_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/waiting-room/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    # Token Bucket: 초당 replenishRate 채움, 순간 최대 burstCapacity.
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:10}
                    redis-rate-limiter.requestedTokens: 1
            # 나머지는 한도 없이 통과.
            - id: passthrough
              uri: ${COUPON_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/**
